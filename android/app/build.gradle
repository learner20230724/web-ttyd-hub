apply plugin: 'com.android.application'
android {
    namespace 'cn.guihualab.ttydhub'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.guihualab.ttydhub'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('HUB_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('HUB_ANDROID_KEYSTORE'))
                storePassword System.getenv('HUB_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('HUB_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('HUB_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
