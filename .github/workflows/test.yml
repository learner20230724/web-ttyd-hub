name: Test Hub
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux ttyd
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npm install --global @openai/codex@0.163.0
      - if: runner.os == 'Linux'
        run: node tests/codex-cold-start-integration.cjs
      - if: runner.os == 'Linux'
        run: node tests/mobile-command-integration.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/codex-picker-browser.cjs
      - run: node tests/mobile-input-browser.cjs
      - run: node tests/activity-browser.cjs
      - run: node tests/mobile-state-browser.cjs
      - run: node tests/mobile-cold-start-browser.cjs
      - run: node tests/mobile-lifecycle-browser.cjs
      - run: node tests/session-lifecycle-browser.cjs
      - run: node tests/session-transport-browser.cjs
      - run: node tests/mobile-answer-presentation-browser.cjs
      - run: node tests/session-sync-browser.cjs
      - run: node tests/session-metadata-browser.cjs
      - run: node tests/mobile-local-cache-browser.cjs
      - run: node tests/content-cache-browser.cjs
      - run: node tests/terminal-read-browser.cjs
      - run: node tests/codex-mobile-browser.cjs
      - if: runner.os == 'Linux'
        run: npm run test:terminal
      - if: runner.os == 'Linux'
        run: node tests/terminal-cache-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.os }}
          path: output/playwright/
          if-no-files-found: ignore
      - if: runner.os == 'Windows'
        run: npm run build
        env:
          HUB_BASE_PATH: /home-terminal
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.os }}
          path: server/public/
